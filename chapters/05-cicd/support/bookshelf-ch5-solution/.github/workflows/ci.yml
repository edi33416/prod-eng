# Continuous integration: the Chapter 3 regression pipeline, run by GitHub
# on every push to main and every pull request targeting main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Package index for every pip install, including the one in the Docker build.
# Set the repository variable PIP_INDEX_URL to use an internal index.
env:
  PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.org/simple/' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dev tools
        run: pip install -r requirements-dev.lock
      - name: make lint
        run: make lint
      - name: make typecheck
        run: make typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: make coverage
        run: make coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  test-pg:
    name: test-pg
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same role as docker-compose.test.yml: a throwaway PostgreSQL for the suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bookshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bookshelf_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/bookshelf_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: pytest against PostgreSQL
        run: pytest tests/

  build:
    name: build
    needs: [lint, test, test-pg]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: bookshelf:${{ github.sha }}
          build-args: PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
